name = "wavlinsite"
main = "worker/index.js"
compatibility_date = "2026-04-04"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/p", "/p/*", "/card/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "CARDS"
id = "b8950c45709745a6b5bd390718399774"
